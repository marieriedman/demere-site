<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Back to Flipside</title>
<style>:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--rule:#d2d2d7;--link:#0b5fd1}@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#f2f2f4;--muted:#a1a1a6;--rule:#3a3a3c;--link:#6aa8ff}}
body{background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;margin:0}main{max-width:42rem;margin:0 auto;padding:2.5rem 16px 4rem}h1{font-size:2rem;margin:0 0 .25rem}h2{font-size:1.2rem;margin:2rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--rule)}.meta{color:var(--muted)}a{color:var(--link)}li{margin:.3rem 0} .btn{display:inline-block;padding:.7rem 1.2rem;border-radius:999px;background:var(--link);color:#fff;text-decoration:none}</style></head>
<body><main>
<h1>Signing in…</h1>
<p>Normally Android opens Flipside before this page appears. If you can read this, tap the button.</p>
<p><a id="back" class="btn" href="flipside://auth-callback">Return to Flipside</a></p>
<p class="meta">The one-time code in this address is useless without the secret that stayed on your phone (PKCE). This page sends nothing anywhere.</p>
<script>
  // Hand the code and state to the app's flipside:// link; never log or send them anywhere else.
  var target = "flipside://auth-callback" + window.location.search;
  document.getElementById("back").href = target;
  window.location.replace(target);
</script>
</main></body></html>
